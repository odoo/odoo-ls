[package]
name = "odoo_ls_server"
version = "1.4.0"
edition = "2024"
authors = ["Odoo"]
readme = "../README.md"
repository = "https://github.com/odoo/odoo-ls"
license = "../LICENSE"
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
glob = "0.3.3"
regex = "1.12.3"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0", version = "0.0.0" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0", version = "0.0.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0", version = "0.0.0" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0", version = "0.0.0" }
lsp-server = { git = "https://github.com/rust-lang/rust-analyzer", tag = "2025-08-04", version = "0.7.6" }
serde = "1.0.228"
serde_json = "1.0.149"
url = "2.5.8"
weak-table = "0.3.2"
lsp-types = "0.97.0"
crossbeam-channel = "0.5.15"
path-slash = "0.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.4"
tracing-panic = "0.1.2"
winapi = { version = "0.3.9", features = ["winbase", "processthreadsapi", "synchapi", "handleapi"] }
ctrlc = "3.5.2"
once_cell = "1.21.4"
itertools = "0.14.0"
byteyarn = "0.5.1"
roxmltree = "0.20.0"
dirs = "5.0"
toml = "0.9.12"
schemars = "1.2.1"
csv = "1.4.0"
slotmap = "1.1.1"
rustc-hash = "2.1"
# ittapi = "0.3" # profiling with VTune profiler
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.29.0", features = ["process"] }
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"

[[bench]]
name = "gungraun_bench"
harness = false

[dev-dependencies]
gungraun = "0.17.2"
assert_fs = "1.1"

[features]
default = []
debug_yarn = []  # use a readable structure instead of Yarn for debug purpose

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
codegen-units = 1
lto = "thin"
