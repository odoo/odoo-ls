name: CI

on:
  pull_request:
  push:
    branches: [release, alpha, alpha-1.7.0]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  # Cargo.toml's [profile.dev.package."*"] keeps line tables in deps, and std ships its own
  CARGO_PROFILE_DEV_STRIP: debuginfo

jobs:
  tests:
    name: clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Read MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy

      # rust-cache hashes every installed toolchain, and the image's preinstalled stable changes weekly
      - name: Remove other Rust toolchains
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain list --quiet | grep -v "^${MSRV}-" | xargs -r -n1 rustup toolchain uninstall

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: ${{ github.event_name == 'push' }}

      - name: Fetch dependencies
        run: cargo fetch --target x86_64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Checkout Odoo
        uses: actions/checkout@v6
        with:
          repository: odoo/odoo
          ref: master
          path: community
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # the only addons we need are base and web (tsserver reads web from disk)
          sparse-checkout: |
            /odoo/
            !/odoo/addons/*/
            /odoo/addons/base/
            /addons/web/

      - name: Install TypeScript
        run: npm install --global typescript@6

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build tests
        run: cargo nextest run --no-run

      - name: Run tests
        env:
          COMMUNITY_PATH: ${{ github.workspace }}/community
          TSSERVER: tsserver
        run: cargo nextest run --profile ci

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: server/target/nextest/ci/junit.xml
