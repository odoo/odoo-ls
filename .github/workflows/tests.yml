name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  tests:
    name: clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Read MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy

      - name: Fetch dependencies
        run: cargo fetch --target x86_64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Checkout Odoo
        uses: actions/checkout@v6
        with:
          repository: odoo/odoo
          ref: master
          path: community
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # the only addons we need are base and web (tsserver reads web from disk)
          sparse-checkout: |
            /odoo/
            !/odoo/addons/*/
            /odoo/addons/base/
            /addons/web/

      - name: Install TypeScript
        run: npm install --global typescript@6

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build tests
        run: cargo nextest run --no-run

      - name: Run tests
        env:
          COMMUNITY_PATH: ${{ github.workspace }}/community
          TSSERVER: tsserver
        run: cargo nextest run --profile ci

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: server/target/nextest/ci/junit.xml
